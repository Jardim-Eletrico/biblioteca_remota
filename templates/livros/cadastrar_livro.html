{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar livros</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <h1>Cadastrar livro</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="titulo" placeholder="Título">

        <input type="text" name="autor" placeholder="Autor">

        <textarea name="sinopse" placeholder="Sinopse"></textarea>

        <label for="generos">Gêneros:</label>

        <select name="generos" id="generos" multiple>
            {% for genero in generos %}
                <option value="{{ genero.id }}">
                    {{ genero.nome }}
                </option>
            {% endfor %}
        </select>

        <input type="text" name="editora" placeholder="Editora">

        <input type="number" name="ano" placeholder="Ano">

        <input type="file" name="capa">

        <button type="submit">Cadastrar exemplar</button>

    </form>

</body>

</html>
