<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar livro</title>
</head>
<body>
    <h1>Editar livro</h1>

    {% if livro.capa %}
    <img src="{{ livro.capa.url }}" width="200" alt="">
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Título</label>
            <input type="text" name="titulo" value="{{ livro.titulo }}">

         <label>Autor</label>
            <input type="text" name="autor" value="{{ livro.autor }}">

        <label>Sinopse</label>
            <textarea name="sinopse">{{ livro.sinopse }}</textarea>

        <label>Gênero</label>
            <input type="text" name="genero" value="{{ livro.genero }}">

        <label>Editora</label>
            <input type="text" name="editora" value="{{ livro.editora }}">

        <label>Ano</label>
            <input type="number" name="ano" value="{{ livro.ano }}">

        <label>Nova capa</label>
            <input type="file" name="capa">

    <button type="submit">SALVAR ALTERAÇÕES</button>

    </form>

</body>
</html>
