openapi: 3.0.3
info:
  title: Biblioteca API
  version: 1.0.0
paths:
  /api/cadastro/:
    post:
      operationId: cadastro_create
      tags:
      - cadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/edicoes/:
    get:
      operationId: edicoes_list
      tags:
      - edicoes
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edicao'
          description: ''
    post:
      operationId: edicoes_create
      tags:
      - edicoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdicaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EdicaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EdicaoRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edicao'
          description: ''
  /api/edicoes/{edicao_id}/exemplares/:
    post:
      operationId: edicoes_exemplares_create
      parameters:
      - in: path
        name: edicao_id
        schema:
          type: integer
        required: true
      tags:
      - edicoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExemplarLoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExemplarLoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExemplarLoteRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExemplarLote'
          description: ''
  /api/livros/:
    get:
      operationId: livros_list
      tags:
      - livros
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livro'
          description: ''
  /api/livros/{id}/:
    get:
      operationId: livros_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - livros
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Livro'
          description: ''
    put:
      operationId: livros_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - livros
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LivroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LivroRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Livro'
          description: ''
    patch:
      operationId: livros_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - livros
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLivroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLivroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLivroRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Livro'
          description: ''
    delete:
      operationId: livros_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - livros
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/livros/cadastrar/:
    post:
      operationId: livros_cadastrar_create
      tags:
      - livros
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LivroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LivroRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Livro'
          description: ''
  /api/login/:
    post:
      operationId: login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/logout/:
    post:
      operationId: logout_create
      tags:
      - logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Edicao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ano_publicacao:
          type: integer
          maximum: 9999
          minimum: 1000
        editora:
          type: string
          maxLength: 200
        numero_paginas:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        edicao:
          type: string
          nullable: true
          maxLength: 20
        capa:
          type: string
          format: uri
          nullable: true
        isbn:
          type: string
          nullable: true
          maxLength: 17
        livro:
          type: integer
      required:
      - ano_publicacao
      - editora
      - id
      - livro
    EdicaoRequest:
      type: object
      properties:
        ano_publicacao:
          type: integer
          maximum: 9999
          minimum: 1000
        editora:
          type: string
          minLength: 1
          maxLength: 200
        numero_paginas:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        edicao:
          type: string
          nullable: true
          minLength: 1
          maxLength: 20
        capa:
          type: string
          format: binary
        isbn:
          type: string
          nullable: true
          maxLength: 17
        livro:
          type: integer
      required:
      - ano_publicacao
      - editora
      - livro
    ExemplarLote:
      type: object
      properties:
        quantidade:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - quantidade
    ExemplarLoteRequest:
      type: object
      properties:
        quantidade:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - quantidade
    Livro:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 200
        subtitulo:
          type: string
          maxLength: 200
        autor:
          type: string
          maxLength: 200
        descricao:
          type: string
          maxLength: 1000
        generos:
          type: string
          maxLength: 90
        ano_original:
          type: integer
          maximum: 9999
          minimum: 1000
        cdd:
          type: integer
          nullable: true
      required:
      - ano_original
      - autor
      - id
      - titulo
    LivroRequest:
      type: object
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        subtitulo:
          type: string
          maxLength: 200
        autor:
          type: string
          minLength: 1
          maxLength: 200
        descricao:
          type: string
          maxLength: 1000
        generos:
          type: string
          maxLength: 90
        ano_original:
          type: integer
          maximum: 9999
          minimum: 1000
        cdd:
          type: integer
          nullable: true
      required:
      - ano_original
      - autor
      - titulo
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PatchedLivroRequest:
      type: object
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        subtitulo:
          type: string
          maxLength: 200
        autor:
          type: string
          minLength: 1
          maxLength: 200
        descricao:
          type: string
          maxLength: 1000
        generos:
          type: string
          maxLength: 90
        ano_original:
          type: integer
          maximum: 9999
          minimum: 1000
        cdd:
          type: integer
          nullable: true
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        nome:
          type: string
          maxLength: 200
      required:
      - email
      - id
      - nome
    UsuarioRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        nome:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - email
      - nome
      - password
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
